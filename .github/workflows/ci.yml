name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run typecheck

  web:
    name: web (offline viewer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # app.css と p5 を同梱物から再生成できることを確認する
      - run: npm run build:web
      - run: npm run test:web
      - run: npm run test:web:states

  cli:
    name: cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: CLI surface
        run: |
          node bin/l4sb.cjs --version
          node bin/l4sb.cjs --help
      - name: Doctor JSON is machine-readable
        run: |
          set +e
          node bin/l4sb.cjs doctor --json > doctor.json
          code=$?
          set -e
          node -e 'const d=require("./doctor.json"); if(!d.checks?.length) process.exit(1); if(typeof d.ok!=="boolean") process.exit(1)'
          echo "doctor exit: $code (expected non-zero when lake is absent)"
